<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — StudyTrade NSE Quant Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-main: #070b12;
            --bg-card: #0f172a;
            --border-color: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.25);
        }
        body {
            background-color: var(--bg-main);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px -10px var(--accent-glow);
            width: 100%;
            max-width: 440px;
            padding: 2.25rem;
        }
        .form-control {
            background-color: #0b1120;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
        }
        .form-control:focus {
            background-color: #0d1527;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25);
            color: #fff;
        }
        .btn-cyan {
            background-color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #042f2e;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-cyan:hover {
            background-color: #0891b2;
            border-color: #0891b2;
            color: #fff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-dark border border-secondary mb-3">
                <i class="bi bi-key-fill text-info fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1">Reset Password</h4>
            <p class="small text-muted mb-0">Enter your operator email to receive a secure password recovery link.</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 px-3 small border-0 mb-3" style="background-color: rgba(244, 63, 94, 0.15); color: #fb7185;">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Please enter a valid email address.
        </div>
        {% endif %}

        <form method="post" action="{% url 'forgot_password' %}">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label small text-secondary fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>
                <div class="form-text text-muted small mt-1">Enter your registered email address to receive recovery instructions.</div>
            </div>

            <button type="submit" class="btn btn-cyan w-100 mb-3">
                <i class="bi bi-send-fill me-1"></i> Send Password Reset Link
            </button>

            <div class="text-center">
                <a href="{% url 'login' %}" class="small text-secondary text-decoration-none hover-light">
                    <i class="bi bi-arrow-left me-1"></i> Return to Secure Login
                </a>
            </div>
        </form>
    </div>
</body>
</html>
