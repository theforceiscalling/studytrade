<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Email Dispatched — StudyTrade</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-main: #070b12;
            --bg-card: #0f172a;
            --border-color: #1e293b;
            --accent-cyan: #06b6d4;
        }
        body {
            background-color: var(--bg-main);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 460px;
            padding: 2.25rem;
            text-align: center;
        }
        .btn-cyan {
            background-color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #042f2e;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-dark border border-success mb-3">
            <i class="bi bi-envelope-check-fill text-success fs-2"></i>
        </div>
        <h4 class="fw-bold mb-2">Check Your Email</h4>
        <p class="text-secondary small mb-3">
            If an account exists with <strong class="text-info font-monospace">tusharpgtbiology@gmail.com</strong>, we have dispatched a password reset link.
        </p>

        <div class="alert alert-dark text-start border-secondary small py-2 px-3 mb-4 font-monospace">
            <i class="bi bi-info-circle text-info me-1"></i>
            Please check your inbox (and spam/junk folder) for the password recovery link. The link expires in 24 hours.
        </div>

        <a href="{% url 'login' %}" class="btn btn-cyan w-100">
            <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
    </div>
</body>
</html>
