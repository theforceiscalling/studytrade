<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyTrade — Systematic Option Buying Framework{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --bg-card-hover: #172033;
            --border-color: #1f2937;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-amber: #f59e0b;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-main);
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }
        .navbar-custom {
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .card-custom {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: #374151;
        }
        .stat-val {
            font-size: 1.75rem;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .stat-label {
            font-size: 0.825rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-call {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .badge-put {
            background-color: rgba(244, 63, 94, 0.2);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.4);
        }
        .table-custom {
            color: #e5e7eb;
            font-size: 0.875rem;
        }
        .table-custom th {
            background-color: #1a2234;
            color: #9ca3af;
            border-bottom: 1px solid #374151;
            font-weight: 600;
        }
        .table-custom td {
            border-bottom: 1px solid #1f2937;
            vertical-align: middle;
        }
        .btn-cyan {
            background-color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #042f2e;
            font-weight: 600;
        }
        .btn-cyan:hover {
            background-color: #0891b2;
            border-color: #0891b2;
            color: #fff;
        }
        .code-box {
            font-family: ui-monospace, SFMono-Regular, monospace;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
        }
    </style>
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'dashboard:overview' %}">
                <i class="bi bi-graph-up-arrow text-info me-2 fs-4"></i>
                <span>Study<span class="text-info">Trade</span></span>
                <span class="badge bg-secondary ms-2 text-uppercase" style="font-size: 0.65rem;">NSE Quant Engine</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'overview' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:overview' %}">
                            <i class="bi bi-speedometer2 me-1"></i> Overview
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'data_lab' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:data_lab' %}">
                            <i class="bi bi-database me-1"></i> Data Lab
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'features' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:features' %}">
                            <i class="bi bi-activity me-1"></i> Features & Regimes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'gamma_squeeze' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:gamma_squeeze' %}">
                            <i class="bi bi-lightning-charge me-1"></i> Gamma Squeeze
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'backtest' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:backtest' %}">
                            <i class="bi bi-play-circle me-1"></i> Backtesting
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'analytics' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:analytics' %}">
                            <i class="bi bi-shield-check me-1"></i> Monte Carlo & DSR
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'risk' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:risk' %}">
                            <i class="bi bi-calculator me-1"></i> Risk & Sizing
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.resolver_match.url_name == 'paper' %}active text-info fw-bold{% endif %}" href="{% url 'dashboard:paper' %}">
                            <i class="bi bi-journal-code me-1"></i> Paper Cockpit
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="badge bg-dark border border-secondary text-light py-2 px-3">
                        <i class="bi bi-circle-fill text-success me-1" style="font-size: 0.6rem;"></i> NSE India
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
