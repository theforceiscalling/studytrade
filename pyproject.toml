[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studytrade"
version = "0.1.0"
description = "Systematic option buying research, backtesting, and paper-trading framework for NSE India."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",           # Parquet I/O
    "pydantic>=2.5",           # Config validation
    "pyyaml>=6.0",             # Config files
    "python-dotenv>=1.0",      # .env loading

    # Math / Stats
    "scipy>=1.11",             # Optimization, distributions
    "statsmodels>=0.14",       # GARCH, statistical tests

    # Visualization
    "matplotlib>=3.8",
    "plotly>=5.18",

    # Utilities
    "rich>=13.0",              # Pretty console output
    "typer>=0.9",              # CLI (future)
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",           # Hidden Markov Models
]
broker = [
    "kiteconnect>=5.0",        # Zerodha Kite
]
dashboard = [
    "streamlit>=1.28",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",        # Property-based testing
    "py_vollib>=1.0.1",        # BSM validation reference
    "ruff>=0.1",               # Linting
    "mypy>=1.7",               # Type checking
    "ipykernel>=6.0",          # Jupyter support
    "jupyterlab>=4.0",
]
all = ["studytrade[ml,broker,dashboard,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need external data or APIs",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
